description: >-
  FOCUS-aligned FinOps view of Rime. Rime is priced per minute of TTS audio generated, with
  Growth-tier customers committing to a $5K annual minimum for ~10% rate discount. Scale is
  enterprise-priced.
notes: Single primary meter (minutes of synthesized audio); plan-tier choice drives unit cost.
sources:
- https://www.rime.ai/pricing
- https://docs.rime.ai/
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Rime
serviceCategory: AI
billingModel:
  pricingCategory: Usage-Based (Per Minute)
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Rime TTS
  ServiceCategory: AI
  ProviderName: Rime
  PublisherName: Rime
  InvoiceIssuerName: Rime
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
- name: tts_minutes
  description: Minutes of TTS audio synthesized.
  unit: minute
  aggregation: sum
  dimensions:
  - account
  - model
  - voice
- name: voice_clones
  description: Custom voice clone count (capacity).
  unit: voice_clone
  aggregation: max
  dimensions:
  - account
- name: annual_commit
  description: Growth-tier minimum $5K annual commitment.
  unit: USD
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track minutes synthesized per voice/model in Rime dashboard.
- name: Allocation
  description: Tag voices and integrations to business units.
- name: Optimization
  description: Move to Growth tier when annual TTS spend exceeds $5K to capture rate discount.
- name: Accountability
  description: Assign a budget owner per integration consuming TTS.
