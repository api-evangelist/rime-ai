description: >-
  Rime offers per-minute TTS pricing across three commercial tiers (Pay-as-you-go, Growth,
  Scale) plus startup grants. Synthesis is priced per minute of generated audio
  (~1,000 characters/minute) with concurrency caps tied to plan.
notes: Reconciled from Rime's public pricing page (May 2026). Free tier exists but specifics not detailed publicly.
