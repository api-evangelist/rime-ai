tools:
- name: list_voices
  description: 'List Rime''s voice catalog as JSON keyed by model and language: { modelId: { langCode:
    [speaker, ...] } }. No API key required. Optionally filter by `model` (e.g. ''coda'', ''mistv3'',
    ''arcana'') and/or `language` (the ISO 639-2 catalog key, e.g. ''eng''), and cap output with `limit`
    (max speakers per model+language list). Use get_voice_details for demographics and the exact `lang`
    value to pass to synthesize_speech.'
- name: get_voice_details
  description: 'Return detailed metadata for Rime voices (gender, age, accent/dialect, country, genre,
    model, and language). This is where the `lang` value for synthesize_speech comes from, and it carries
    the demographic metadata you use to choose a voice. No API key required. All filters are optional
    and applied client-side: `speaker`, `model`, `gender`, `language` (matches either the `language` or
    `lang` field).'
- name: check_dictionary
  description: Check which words are NOT in Rime's pronunciation dictionary. Returns the list of out-of-dictionary
    words; an empty list means all words are covered. Out-of-dictionary words still synthesize, but you
    may want to add custom pronunciations for them. Requires RIME_API_KEY.
- name: normalize_text
  description: Preview how Rime normalizes text before synthesis — exactly what the TTS model will speak.
    Useful for debugging numbers, dates, phone numbers, currency, and abbreviations. Returns the normalized
    string. Requires RIME_API_KEY.
- name: synthesize_speech
  description: 'Generate an MP3 speech sample from text using Rime TTS, rendered in an inline audio player.
    All arguments are optional: with none, it plays a default sample in the canonical demo voice (`lyra`
    on the `coda` flagship model) — the fastest way to hear Rime. Choose `speaker` and `modelId` from
    list_voices / get_voice_details to try others. The `language` argument is optional: by default it
    is omitted and Rime infers the language from the speaker (works for English); when provided it is
    sent as `lang` (e.g. ''eng'', the value from get_voice_details). This calls Rime''s API and consumes
    credits, so keep sample text short. Requires RIME_API_KEY.


    PLAYBACK: UI hosts render an inline audio player. In a terminal/agent host that can''t render the
    widget, download the returned play URL (also in structuredContent.audioUrl) and play it with a system
    player — e.g. `curl -s <url> -o /tmp/rime.mp3 && (afplay /tmp/rime.mp3 || ffplay -nodisp -autoexit
    /tmp/rime.mp3 || mpv /tmp/rime.mp3 || aplay /tmp/rime.mp3)`. Set include_audio=true to also receive
    a standard MCP audio block for hosts that play audio natively.'
- name: generate_integration
  description: Generate a ready-to-run code snippet for wiring Rime TTS into a voice agent framework (Pipecat
    or LiveKit). Returns install commands, code, and .env notes. No network call. Pipecat is Python-only.
    For LiveKit, `mode` selects 'plugin' (use your own Rime key) or 'inference' (run on LiveKit Cloud,
    no Rime key).
